<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>California Wildfire Supply Chain Simulator</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{
  --p500:#766DA7;--g500:#7A9663;--g600:#556842;--g400:#A0AE91;
  --bg:#f0ede8;--card:#faf8f5;--border:#d4cfc8;--txt:#15191E;--txt2:#6e6b65;
  --red:#c0392b;--amber:#b07d20;--green:#4a7c59;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--g600);color:#e8e4de;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:1.05rem;font-weight:600;letter-spacing:0.02em}
#status-bar{font-size:0.75rem;margin-left:auto;opacity:0.85}
.main{display:flex;flex:1;overflow:hidden}
.col-left{width:200px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.col-mid{flex:1;display:flex;flex-direction:column;overflow:hidden}
.col-right{width:290px;background:var(--card);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.panel-title{font-size:0.65rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--txt2);padding:8px 12px 4px;border-bottom:1px solid var(--border)}
#tl-wrap{padding:10px 8px;display:flex;flex-direction:column;gap:4px}
.tl-item{display:flex;align-items:flex-start;gap:6px;padding:5px 7px;border-radius:5px;cursor:pointer;transition:background .15s}
.tl-item:hover{background:rgba(118,109,167,0.08)}
.tl-item.active{background:rgba(118,109,167,0.15);border-left:2px solid var(--p500)}
.tl-dot{width:8px;height:8px;border-radius:50%;background:var(--border);margin-top:4px;flex-shrink:0}
.tl-item.active .tl-dot{background:var(--p500)}
.tl-item.done .tl-dot{background:var(--g500)}
.tl-label{font-size:0.75rem;font-weight:600;line-height:1.3}
.tl-sub{font-size:0.67rem;color:var(--txt2);line-height:1.3}
#map-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.map-inner{flex:1;position:relative;overflow:hidden}
#map{position:absolute;inset:0}
#smoke-bar{height:28px;background:#fff7ed;border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:8px;font-size:0.72rem;flex-shrink:0}
.smoke-label{color:var(--txt2);font-weight:600;min-width:80px}
.smoke-track{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.smoke-fill{height:100%;border-radius:3px;background:var(--amber);transition:width .4s}
.smoke-pct{min-width:60px;color:var(--txt2);text-align:right}
#alloc-wrap{padding:6px 10px;display:flex;flex-direction:column;gap:5px;max-height:195px;overflow-y:auto;flex-shrink:0}
.supplier-card{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.supplier-card.disabled{opacity:0.45}
.sup-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:1px}
.sup-name{font-size:0.78rem;font-weight:600}
.sup-meta{font-size:0.67rem;color:var(--txt2)}
.sup-origin{font-size:0.63rem;color:var(--txt2);margin-bottom:1px}
.alloc-row{display:flex;align-items:center;gap:6px}
.alloc-row label{font-size:0.68rem;color:var(--txt2);min-width:28px}
input[type=range]{flex:1;accent-color:var(--p500)}
.alloc-num{font-size:0.75rem;font-weight:600;min-width:36px;text-align:right}
#budget-wrap{padding:5px 12px;border-top:1px solid var(--border);flex-shrink:0}
.budget-row{display:flex;justify-content:space-between;font-size:0.72rem;padding:2px 0}
.budget-total{font-weight:700;font-size:0.8rem;border-top:1px solid var(--border);margin-top:4px;padding-top:4px}
.budget-ok{color:var(--green)}
.budget-over{color:var(--red)}
#events-wrap{flex:1;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:5px;min-height:0}
.event-item{font-size:0.71rem;line-height:1.45;padding:6px 8px;border-radius:4px;border-left:3px solid var(--border)}
.event-item.info{border-color:var(--g500);background:rgba(122,150,99,0.07)}
.event-item.warn{border-color:var(--amber);background:rgba(176,125,32,0.08)}
.event-item.crit{border-color:var(--red);background:rgba(192,57,43,0.07)}
#advance-wrap{padding:10px 12px;border-top:1px solid var(--border);flex-shrink:0}
#btn-advance{width:100%;padding:8px;background:var(--g600);color:#e8e4de;border:none;border-radius:5px;font-size:0.8rem;font-weight:600;cursor:pointer;transition:background .15s}
#btn-advance:hover{background:var(--p500)}
#btn-advance:disabled{opacity:0.5;cursor:not-allowed}
#outcome-modal{display:none;position:fixed;inset:0;background:rgba(21,25,30,0.72);z-index:9000;align-items:center;justify-content:center}
#outcome-modal.show{display:flex}
#outcome-box{background:var(--card);border-radius:10px;padding:24px 28px;max-width:640px;width:94%;max-height:88vh;overflow-y:auto}
#outcome-box h2{font-size:1.2rem;margin-bottom:6px;color:var(--g600)}
#outcome-grade{font-size:3.5rem;font-weight:800;color:var(--p500);margin-bottom:12px}
#outcome-body{font-size:0.82rem;line-height:1.7;color:var(--txt)}
#outcome-hist{margin-top:14px;padding:12px;background:var(--bg);border-radius:6px;font-size:0.78rem;color:var(--txt2);line-height:1.6;border-left:3px solid var(--g400)}
#outcome-close{margin-top:18px;padding:8px 20px;background:var(--g600);color:#e8e4de;border:none;border-radius:5px;cursor:pointer;font-size:0.8rem}
#outcome-loading{text-align:center;padding:30px;font-size:0.85rem;color:var(--txt2)}
#chart-wrap{display:none;flex-direction:column;height:100%}
#chart-area{padding:14px 16px;flex:1;display:flex;flex-direction:column}
#chart-area h3{font-size:0.8rem;font-weight:600;margin-bottom:10px;color:var(--txt)}
#chart-area canvas{flex:1;min-height:0}
.emoji-icon{font-size:22px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,0.4))}
</style>
</head>
<body>
<header>
  <span style="font-size:1.4rem">🍷</span>
  <h1>California Wildfire Supply Chain Simulator</h1>
  <div id="status-bar">Round 0 / 6</div>
</header>
<div class="main">
  <div class="col-left">
    <div class="panel-title">Timeline</div>
    <div id="tl-wrap"></div>
    <div style="flex:1"></div>
    <div id="advance-wrap">
      <button id="btn-advance" onclick="advance()">Start Simulation ▶</button>
    </div>
  </div>
  <div class="col-mid">
    <div id="map-area">
      <div class="map-inner">
        <div id="map"></div>
      </div>
      <div id="smoke-bar">
        <span class="smoke-label">Air Quality</span>
        <div class="smoke-track"><div class="smoke-fill" id="smoke-fill" style="width:8%"></div></div>
        <span class="smoke-pct" id="smoke-pct">AQI 45 Good</span>
      </div>
    </div>
    <div id="chart-wrap">
      <div id="chart-area">
        <h3>Node 6 · Napa Valley Historical Data (2018–2022)</h3>
        <canvas id="myChart"></canvas>
      </div>
    </div>
  </div>
  <div class="col-right">
    <div class="panel-title">Procurement</div>
    <div id="alloc-wrap"></div>
    <div id="budget-wrap">
      <div class="budget-row"><span>Allocated</span><span id="b-alloc">0 cases</span></div>
      <div class="budget-row"><span>Target Demand</span><span id="b-demand">7,000 cases</span></div>
      <div class="budget-row budget-total"><span>Procurement Cost</span><span id="b-cost" class="budget-ok">$0</span></div>
    </div>
    <div class="panel-title" style="margin-top:4px">Event Feed</div>
    <div id="events-wrap"></div>
  </div>
</div>
<div id="outcome-modal">
  <div id="outcome-box">
    <h2>Supply Chain Assessment</h2>
    <div id="outcome-grade"></div>
    <div id="outcome-body"></div>
    <div id="outcome-hist"></div>
    <button id="outcome-close" onclick="document.getElementById('outcome-modal').classList.remove('show')">Close</button>
  </div>
</div>

  "headline": "One sentence, under 15 words",

  "historicalComparison": "50-80 words comparing to real 2020 California wine supply chain events"
}
Scoring weights: demand fill rate (40%), cost control (30%), supplier diversification (20%), crisis pivot speed (10%).

Return ONLY the JSON. No other text.`

function renderTL(){
  const w=document.getElementById('tl-wrap');
  w.innerHTML='';
  TL.forEach((t,i)=>{
    const d=document.createElement('div');
    d.className='tl-item'+(i<cur?' done':i===cur-1?' active':'');
    d.innerHTML=`<div class="tl-dot"></div><div><div class="tl-label">${t.label}</div><div class="tl-sub">${t.sub}</div></div>`;
    w.appendChild(d);
  });
}

function renderStatus(){
  document.getElementById('status-bar').textContent=`Round ${cur} / ${TL.length}`;
}

function renderSmoke(){
  const v=AQI_VAL[Math.min(cur,AQI_VAL.length-1)];
  const pct=Math.min(100,Math.round((v/300)*100));
  document.getElementById('smoke-fill').style.width=pct+'%';
  const fill=document.getElementById('smoke-fill');
  fill.style.background=v<100?'var(--green)':v<150?'var(--amber)':'var(--red)';
  document.getElementById('smoke-pct').textContent=AQI_TEXT[Math.min(cur,AQI_TEXT.length-1)];
}

function addEvents(round){
  const w=document.getElementById('events-wrap');
  const evs=EVENTS[Math.min(round,EVENTS.length-1)]||[];
  evs.forEach(e=>{
    const d=document.createElement('div');
    d.className='event-item '+e.type;
    d.textContent=e.text;
    w.prepend(d);
  });
}

function applyAction(){
  const crisis=cur>=3;
  Object.keys(SUP).forEach(k=>{
    const s=SUP[k];
    s.activeCap=crisis?s.crisisCap:s.cap;
    s.activePrice=crisis?s.crisisPrice:s.price;
    const card=document.getElementById('card-'+k);
    if(!card)return;
    const rng=card.querySelector('input[type=range]');
    const meta=card.querySelector('.sup-meta');
    if(rng){rng.max=s.activeCap;if(parseInt(rng.value)>s.activeCap)rng.value=s.activeCap;}
    if(meta)meta.textContent=`$${s.activePrice}/case · max ${s.activeCap.toLocaleString()}`;
    card.classList.toggle('disabled',s.activeCap===0);
  });
  recalc();
}

function alloc(){
  const w=document.getElementById('alloc-wrap');
  w.innerHTML='';
  Object.keys(SUP).forEach(k=>{
    const s=SUP[k];
    const cap=s.activeCap||s.cap;
    const price=s.activePrice||s.price;
    const card=document.createElement('div');
    card.className='supplier-card';
    card.id='card-'+k;
    card.innerHTML=`
      <div class="sup-header">
        <span class="sup-name">${s.name}</span>
        <span class="sup-meta">$${price}/case · max ${cap.toLocaleString()}</span>
      </div>
      <div class="sup-origin">${s.origin}</div>
      <div class="alloc-row">
        <label>Qty</label>
        <input type="range" id="rng-${k}" min="0" max="${cap}" step="50" value="0" oninput="recalc()">
        <span class="alloc-num" id="num-${k}">0</span>
      </div>`;
    w.appendChild(card);
  });
  recalc();
}

function computeQualityScore(allocs){
  let wsum=0,total=0;
  Object.keys(allocs).forEach(k=>{
    const v=allocs[k];
    wsum+=v*(QUALITY_BASE[k]||75);
    total+=v;
  });
  return total>0?Math.round(wsum/total):0;
}

function computePivotSpeed(prev,curr){
  let diff=0;
  Object.keys(curr).forEach(k=>{diff+=Math.abs((curr[k]||0)-(prev[k]||0));});
  return diff;
}

function fmt(n){return '$'+n.toLocaleString();}

function recalc(){
  let cost=0,allocated=0;
  Object.keys(SUP).forEach(k=>{
    const rng=document.getElementById('rng-'+k);
    const num=document.getElementById('num-'+k);
    if(!rng)return;
    const v=parseInt(rng.value)||0;
    const price=SUP[k].activePrice||SUP[k].price;
    allocated+=v;
    cost+=v*price;
    if(num)num.textContent=v.toLocaleString();
  });
  document.getElementById('b-alloc').textContent=allocated.toLocaleString()+' cases';
  const costEl=document.getElementById('b-cost');
  costEl.textContent=fmt(cost);
  costEl.className=cost>BUDGET?'budget-over':'budget-ok';
}
function initMap(){
  map=L.map('map',{zoomControl:true,attributionControl:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:13,subdomains:'abcd'
  }).addTo(map);
  map.setView([38.2,-122.4],8);
}

function showFires(mode){
  if(fireLayer){fireLayer.remove();fireLayer=null;}
  fireMarkers.forEach(m=>m.remove());fireMarkers=[];
  const s=mode==='crisis'
    ?{color:'#8b2a1e',weight:1.5,fillColor:'#b03020',fillOpacity:0.38}
    :{color:'#9a6e28',weight:1.5,fillColor:'#cc9940',fillOpacity:0.22};
  fireLayer=L.geoJSON(FIRE_GJ,{style:()=>s,onEachFeature(f,l){
    const ac=(f.properties.GIS_ACRES||0).toLocaleString(undefined,{maximumFractionDigits:0});
    l.bindPopup(`<b>${f.properties.FIRE_NAME}</b><br>${ac} acres`);
  }}).addTo(map);
  FIRE_GJ.features.forEach(f=>{
    const icon=L.divIcon({html:'<div class="emoji-icon">🔥</div>',className:'',iconSize:[28,28],iconAnchor:[14,14]});
    fireMarkers.push(L.marker([f.properties.cLat,f.properties.cLon],{icon}).addTo(map));
  });
}

async function callAPI(pd){
  try{
    const resp=await fetch('https://api.deepseek.com/chat/completions',{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer sk-988f8ac121de4178953af62533bfa1e1'},
      body:JSON.stringify({model:'deepseek-chat',messages:[{role:'system',content:SYS_PROMPT},{role:'user',content:JSON.stringify(pd)}],stream:false})
    });
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    const txt=data.choices[0].message.content;
    const m=txt.match(/\{[\s\S]*\}/);
    if(!m)throw new Error('no JSON');
    return JSON.parse(m[0]);
  }catch(e){console.warn('API failed:',e);return null;}
}

function staticOutcome(pd){
  const fill=pd.fillRate||0;
  const allocs=pd.allocs||{};
  const localVol=(allocs.beringer||0)+(allocs.korbel||0);
  const importVol=(allocs.jacobs||0)+(allocs.concha||0);
  const total=(localVol+importVol)||1;
  const importRatio=importVol/total;
  const numSuppliers=Object.keys(allocs).filter(k=>allocs[k]>0).length;
  const fillPct=Math.round(fill*100);
  const importPct=Math.round(importRatio*100);
  const localPct=100-importPct;

  let score=0;
  score+=fill>=0.95?40:fill>=0.85?32:fill>=0.70?22:fill>=0.50?12:5;
  score+=pd.avgCost<=65?30:pd.avgCost<=75?23:pd.avgCost<=85?16:8;
  score+=numSuppliers>=3?20:numSuppliers===2?13:6;
  score+=importRatio>=0.5?10:importRatio>=0.3?7:importRatio>=0.1?4:2;

  const grade=score>=88?'A':score>=72?'B':score>=55?'C':score>=38?'D':'F';

  let headline,narrative;
  if(grade==='A'){
    headline='Exemplary Wildfire Supply Chain Response';
    narrative=`Strong execution: ${fillPct}% demand filled at controlled cost. ${importPct>=60?'Routing '+importPct+'% through import suppliers (Jacob\\u2019s Creek, Concha y Toro) effectively insulated the chain from fire damage \\u2014 textbook crisis diversification.':numSuppliers>=3?'Spreading volume across '+numSuppliers+' suppliers built resilience even as local capacity contracted.':'Your allocation balanced quality and cost effectively under pressure.'}\n\nThis approach mirrors how top distributors responded in 2020: proactive rebalancing before crisis peak, not after.`;
  }else if(grade==='B'){
    headline='Solid Crisis Procurement Strategy';
    narrative=`Respectable result: ${fillPct}% demand filled. ${importPct>=40?'Leveraging '+importPct+'% import volume was the right call \\u2014 Chile and Australia were unaffected by the fire corridor.':'Shifting more volume toward import suppliers earlier would have reduced exposure when Korbel dropped to 500 cases.'}\n\n${fill<0.90?'The remaining demand gap likely reflects delayed adjustment to Korbel\\u2019s crisis-cap reduction. Earlier pivoting would have closed it.':'Cost management was sound, though the local/import ratio has room to optimize.'}`;
  }else if(grade==='C'){
    headline='Crisis Exposed Supply Chain Vulnerabilities';
    const msg=localPct>60?`Over-reliance on fire-affected local suppliers (${localPct}% of volume) left the chain exposed when Korbel capacity fell to 500 cases.`:`The ${fillPct}% fill rate indicates demand planning fell short of the 7,000-case target.`;
    narrative=`${fillPct}% demand filled \\u2014 below target. ${msg}\n\nConcha y Toro (Chile) and Jacob\\u2019s Creek (Australia) had full capacity throughout the simulation. Routing more volume through them would have recovered most of the gap.`;
  }else{
    headline='Supply Chain Strategy Needs Significant Rework';
    const zeroMsg=total<100?'No meaningful allocation was placed \\u2014 ensure sliders are moved before advancing.':localPct>70?`Heavy local concentration (${localPct}%) became critical when wildfire damage cut Korbel to 500 cases.`:'Available capacities (2,500 Beringer + 500 Korbel + 1,200 Jacob\\u2019s + 3,000 Concha = 7,200 max) were not fully utilized.';
    narrative=`${fillPct}% demand filled \\u2014 well below target. ${zeroMsg}\n\nKey lesson: In a regional disaster, geographic diversification is not optional. Import suppliers become the load-bearing structure of the chain.`;
  }

  const hist='2020 reality: California wildfires cut Napa/Sonoma crush volumes 20\\u201335%. Wine industry imports from Chile, Argentina, and Australia rose ~28% YoY. USDA NASS recorded the sharpest price-per-ton drop of the decade (\\u221217% from 2019), reflecting both demand destruction and surplus in unaffected regions.';
  return{grade,headline,narrative,historicalComparison:hist};
}

function collectPlayerData(){
  const allocs={};
  let totalAlloc=0,totalCost=0;
  Object.keys(SUP).forEach(k=>{
    const rng=document.getElementById('rng-'+k);
    const v=parseInt(rng?rng.value:0)||0;
    allocs[k]=v;
    totalAlloc+=v;
    totalCost+=v*(SUP[k].activePrice||SUP[k].price);
  });
  const fillRate=Math.min(1,totalAlloc/DEMAND);
  const avgCost=totalAlloc>0?Math.round(totalCost/totalAlloc):0;
  const qualityScore=computeQualityScore(allocs);
  const pivotDelta=snapshots[3]?computePivotSpeed(snapshots[3],allocs):0;
  return{round:cur,allocs,totalAlloc,totalCost,fillRate:Math.round(fillRate*100)/100,avgCost,qualityScore,pivotDelta,budget:BUDGET,demand:DEMAND};
}

async function showFinalOutcome(){
  showOutcomeLoading();
  const pd=collectPlayerData();
  pd.roundSnapshots=snapshots;
  const result=await callAPI(pd)||staticOutcome(pd);
  showOutcome(result);
}

function advance(){
  if(cur>=TL.length){showFinalOutcome();return;}
  cur++;
  renderTL();renderStatus();renderSmoke();addEvents(cur-1);
  applyAction();

  if(cur===1){
    document.getElementById('btn-advance').textContent='Next Round ▶';
  }
  if(cur===2){showFires('warning');}
  if(cur===3){showFires('crisis');}
  if(cur===5){
    const allocs={};
    Object.keys(SUP).forEach(k=>{
      const rng=document.getElementById('rng-'+k);
      allocs[k]=parseInt(rng?rng.value:0)||0;
    });
    snapshots[5]=allocs;
  }
  if(cur===TL.length){
    document.getElementById('btn-advance').textContent='View Assessment ✦';
  }
  const allocs={};
  Object.keys(SUP).forEach(k=>{
    const rng=document.getElementById('rng-'+k);
    allocs[k]=parseInt(rng?rng.value:0)||0;
  });
  snapshots[cur]=allocs;
}

function init(){
  renderTL();renderStatus();renderSmoke();
  addEvents(0);
  alloc();
  Object.keys(SUP).forEach(k=>{
    SUP[k].activeCap=SUP[k].cap;
    SUP[k].activePrice=SUP[k].price;
  });
  initMap();
  document.getElementById('btn-advance').textContent='Start Simulation ▶';
}

window.addEventListener('load',init);
